[project]
name = "dex-examples-python"
version = "0.1.0"
description = "Dex Python Samples"
authors = [{name = "Super Durable"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dex-python-sdk==1.14.0",
    "flask>=3.0,<4",
    "litellm>=1.75,<2",
    "mcp>=2.1,<3",
    "pydantic>=2.10.6,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "quart>=0.20.0,<0.21",
]

[dependency-groups]
dev = [
    "mypy>=1.5.1,<2",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.26,<2",
    "pytest-cov>=4.1,<5",
    "pytest-env>=1.0.1,<2",
]

[tool.uv]
package = false
required-version = "==0.12.2"

[tool.pytest.ini_options]
pythonpath = [".", "sync-python"]
testpaths = ["tests", "sync-python/sync_tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integ: integration tests against a running Dex server",
]
