[package]
name = "dex-examples-rust"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.97"

[dependencies]
dex-sdk = "=1.11.0"
fastrand = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

[dev-dependencies]
tempfile = "3.23"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[lints.rust]
unsafe_code = "forbid"
