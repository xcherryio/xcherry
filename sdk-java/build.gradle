plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    id 'checkstyle'
}

group = 'io.superdurable'
// Publish uses tag sdk-java/v*; -PreleaseVersion overrides this for release builds.
version = providers.gradleProperty('releaseVersion').getOrElse('0.6.0-SNAPSHOT')
def artifactVersion = version.toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withJavadocJar()
    withSourcesJar()
}

checkstyle {
    toolVersion = '9.3'
    configFile = file('config/checkstyle/public-api-javadocs.xml')
}

// Published classes stay consumable from Java 8 applications.
tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

// -PtestJavaVersion picks the test JVM; bytecode stays Java 8.
def testLauncher = javaToolchains.launcherFor {
    languageVersion = providers.gradleProperty('testJavaVersion')
            .map { JavaLanguageVersion.of(it) }
            .getOrElse(JavaLanguageVersion.of(25))
}
tasks.withType(Test).configureEach {
    javaLauncher = testLauncher
}

repositories {
    maven {
        url = layout.buildDirectory.dir('publication-repository')
    }
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

def operatingSystemName = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
def architectureName = System.getProperty('os.arch', '').toLowerCase(Locale.ROOT)
def nativeOperatingSystem = operatingSystemName.contains('mac') || operatingSystemName.contains('darwin')
        ? 'macos'
        : operatingSystemName.contains('windows') ? 'windows' : 'linux'
def nativeArchitecture = architectureName == 'aarch64' || architectureName == 'arm64'
        ? 'aarch64'
        : 'x86_64'
def blobCacheNativePlatform = "${nativeOperatingSystem}-${nativeArchitecture}"
def blobCacheNativeLibraryName = nativeOperatingSystem == 'macos'
        ? 'libdex_blob_cache_jni.dylib'
        : nativeOperatingSystem == 'windows'
                ? 'dex_blob_cache_jni.dll'
                : 'libdex_blob_cache_jni.so'
def blobCacheNativeLibraryPath =
        file("../sdk-rust/target/release/${blobCacheNativeLibraryName}")
def generatedNativeResources = layout.buildDirectory.dir('generated/native-resources')
def nativeResourcesPrepared = providers.gradleProperty('nativeResourcesPrepared')
        .map { it.toBoolean() }
        .getOrElse(false)

sourceSets {
    jmh {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    jmhImplementation.extendsFrom implementation
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

    api 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    api 'io.grpc:grpc-api:1.69.1'

    implementation 'com.google.guava:guava:33.4.8-jre'
    implementation 'com.google.protobuf:protobuf-java:4.35.1'
    implementation 'io.grpc:grpc-stub:1.69.1'
    implementation 'io.grpc:grpc-protobuf:1.69.1'
    implementation 'io.grpc:grpc-netty-shaded:1.69.1'
    implementation 'net.bytebuddy:byte-buddy:1.17.8'
    implementation 'org.objenesis:objenesis:3.4'

    // jaskson
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.18.2'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}

tasks.register('buildBlobCacheNative', Exec) {
    description = 'Builds the Rust JNI library used only by BlobCache.'
    workingDir '../sdk-rust'
    commandLine 'cargo', 'build', '--release', '-p', 'dex-blob-cache-jni', '--locked'
    inputs.files(fileTree('../sdk-rust') {
        include 'Cargo.toml', 'Cargo.lock', 'crates/**'
        exclude 'target/**'
    })
    outputs.file blobCacheNativeLibraryPath
}

tasks.register('stageBlobCacheNative', Copy) {
    dependsOn 'buildBlobCacheNative'
    from blobCacheNativeLibraryPath
    into generatedNativeResources.map {
        it.dir("META-INF/native/${blobCacheNativePlatform}")
    }
}

tasks.named('processResources') {
    from generatedNativeResources
    if (!nativeResourcesPrepared) {
        dependsOn 'stageBlobCacheNative'
    }
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Version': artifactVersion)
    }
    from('LICENSE') {
        into 'META-INF'
    }
    from('LEGACY_NOTICES.md') {
        into 'META-INF'
    }
    from('LICENSES') {
        into 'META-INF/LICENSES'
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform {
        excludeTags 'dex-dev'
    }
}

tasks.register('localIntegrationTest', Test) {
    group = 'verification'
    description = 'Runs Java SDK integration tests that do not require dexcli dev.'
    outputs.upToDateWhen { false }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'io.superdurable.dex.NativeBlobCacheIntegrationTest'
        includeTestsMatching 'io.superdurable.dex.WorkerServiceIntegrationTest'
        includeTestsMatching 'io.superdurable.dex.ClientExceptionIntegrationTest'
        includeTestsMatching 'io.superdurable.dex.PullWorkerTest'
        includeTestsMatching 'io.superdurable.dex.CredentialTest'
        includeTestsMatching 'io.superdurable.dex.HardDeleteAttributeMappingTest'
    }
    useJUnitPlatform()
}

tasks.register('dexDevTest', Test) {
    group = 'verification'
    description = 'Runs Java SDK integration tests against dexcli dev.'
    outputs.upToDateWhen { false }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'dex-dev'
    }
    systemProperty 'dex.test.serverAddress',
            System.getenv('DEX_SERVER_ADDRESS') ?: '127.0.0.1:8801'
}

tasks.named('compileJmhJava') {
    options.annotationProcessorPath = configurations.jmhAnnotationProcessor
}

tasks.named('javadoc') {
    dependsOn 'checkstyleMain'
    exclude 'io/superdurable/gen/**'
    failOnError = true
    // Checkstyle owns public-API coverage; doclint validates links and markup without private noise.
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    options.addBooleanOption('Werror', true)
}

tasks.named('checkstyleMain') {
    source = fileTree('src/main/java/io/superdurable/dex') {
        include '**/*.java'
    }
}

tasks.matching {
    it.name.startsWith('checkstyle') && it.name != 'checkstyleMain'
}.configureEach {
    enabled = false
}

tasks.register('blobCacheBenchmark', JavaExec) {
    group = 'benchmark'
    description = 'Measures the Java-to-Rust BlobCache boundary with JMH.'
    dependsOn 'jmhClasses'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    args 'io.superdurable.dex.NativeBlobCacheBenchmark',
            '-wi', '3',
            '-i', '5',
            '-w', '1s',
            '-r', '1s',
            '-f', '1',
            '-t', findProperty('blobCacheBenchmarkThreads') ?: '1'
}

jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

check.dependsOn jacocoTestReport

tasks.register('integrationCoverageReport', JacocoReport) {
    group = 'verification'
    description = 'Reports coverage from only Java SDK integration tests.'
    executionData.setFrom(files(
            layout.buildDirectory.file('jacoco/localIntegrationTest.exec'),
            layout.buildDirectory.file('jacoco/dexDevTest.exec')))
    sourceDirectories.setFrom(sourceSets.main.allJava.srcDirs)
    classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching {
        include 'io/superdurable/dex/**'
    })
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file(
                'reports/jacoco/integration/jacoco.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.dir(
                'reports/jacoco/integration/html')
        csv.required = false
    }
    doFirst {
        def missingExecutionData = executionData.files.findAll { !it.isFile() }
        if (!missingExecutionData.isEmpty()) {
            throw new GradleException(
                    "integration coverage data is missing: ${missingExecutionData*.name.join(', ')}")
        }
    }
}

// Custom task to unpublish from local Maven repository
// Usage: ./gradlew unpublishFromMavenLocal
tasks.register('unpublishFromMavenLocal', Delete) {
    def groupPath = 'io/superdurable/dex-sdk'
    def m2Repo = "${System.getProperty('user.home')}/.m2/repository"
    delete "$m2Repo/$groupPath/${artifactVersion}"
    doFirst {
        println "Deleting $m2Repo/$groupPath/${artifactVersion}"
    }
}

// Maven coordinates: io.superdurable:dex-sdk (reverse-DNS of superdurable.io)
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = 'dex-sdk'
            version = artifactVersion
            from components.java

            pom {
                name = 'Dex Java SDK'
                description = 'Strongly typed Java SDK for the Dex durable workflow engine'
                url = 'https://github.com/superdurable/dex'

                scm {
                    connection = 'scm:git:https://github.com/superdurable/dex.git'
                    developerConnection = 'scm:git:ssh://git@github.com/superdurable/dex.git'
                    url = 'https://github.com/superdurable/dex'
                }

                licenses {
                    license {
                        name = 'Sustainable Use License 1.0'
                        url = 'https://github.com/superdurable/dex/blob/main/LICENSE'
                        distribution = 'repo'
                    }
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://github.com/superdurable/dex/blob/main/LICENSES/Apache-2.0.txt'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'longquanzheng'
                        name = 'Quanzheng Long'
                        email = 'qlong.seattle@gmail.com'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'test'
            url = layout.buildDirectory.dir('publication-repository')
        }
    }
}

def signingKey = providers.gradleProperty('signingKey').orNull
def signingPassword = providers.gradleProperty('signingPassword').getOrElse('')
signing {
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenJava
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri('https://ossrh-staging-api.central.sonatype.com/service/local/'))
            snapshotRepositoryUrl.set(uri('https://central.sonatype.com/repository/maven-snapshots/'))
            // Prefer project properties (set via ORG_GRADLE_PROJECT_* in CI):
            username = providers.gradleProperty('mavenCentralUsername').orNull
            password = providers.gradleProperty('mavenCentralPassword').orNull
        }
    }
}

tasks.register('validateReleaseConfiguration') {
    doLast {
        if (artifactVersion.endsWith('-SNAPSHOT')) {
            throw new GradleException('Maven Central releases require -PreleaseVersion without -SNAPSHOT')
        }
        ['mavenCentralUsername', 'mavenCentralPassword', 'signingKey'].each { propertyName ->
            def value = providers.gradleProperty(propertyName).orNull
            if (value == null || value.trim().isEmpty()) {
                throw new GradleException("Maven Central release requires ${propertyName}")
            }
        }
    }
}

tasks.matching {
    it.name == 'initializeSonatypeStagingRepository'
            || it.name == 'publishToSonatype'
            || it.name.endsWith('ToSonatypeRepository')
            || it.name.startsWith('closeAndReleaseSonatype')
}.configureEach {
    dependsOn 'validateReleaseConfiguration'
}

tasks.register('validatePublication') {
    dependsOn 'publishMavenJavaPublicationToTestRepository'
    doLast {
        def artifactDirectory = layout.buildDirectory.dir(
                "publication-repository/io/superdurable/dex-sdk/${artifactVersion}").get().asFile
        def artifactPrefix = "dex-sdk-${artifactVersion}"
        def mainJar = new File(artifactDirectory, "${artifactPrefix}.jar")
        [mainJar,
         new File(artifactDirectory, "${artifactPrefix}-sources.jar"),
         new File(artifactDirectory, "${artifactPrefix}-javadoc.jar"),
         new File(artifactDirectory, "${artifactPrefix}.pom"),
         new File(artifactDirectory, "${artifactPrefix}.module")].each { artifact ->
            if (!artifact.isFile()) {
                throw new GradleException("publication artifact is missing: ${artifact.name}")
            }
        }
        if (!fileTree(artifactDirectory).matching { include '*-plain.jar' }.isEmpty()) {
            throw new GradleException('publication must not contain a Spring Boot plain JAR')
        }

        def pomText = new File(artifactDirectory, "${artifactPrefix}.pom").text
        if (pomText.contains('<packaging>pom</packaging>')) {
            throw new GradleException('publication POM must use JAR packaging')
        }
        ['openfeign', 'swagger', 'scribejava', 'cron-utils', 'immutables'].each { obsolete ->
            if (pomText.contains(obsolete)) {
                throw new GradleException("publication POM contains obsolete dependency ${obsolete}")
            }
        }

        def nativeLibraries = [
                'linux-x86_64': 'libdex_blob_cache_jni.so',
                'linux-aarch64': 'libdex_blob_cache_jni.so',
                'macos-x86_64': 'libdex_blob_cache_jni.dylib',
                'macos-aarch64': 'libdex_blob_cache_jni.dylib',
                'windows-x86_64': 'dex_blob_cache_jni.dll'
        ]
        def expectedPlatforms = providers.gradleProperty('expectAllNativePlatforms')
                .map { it.toBoolean() }
                .getOrElse(false)
                ? nativeLibraries.keySet()
                : [blobCacheNativePlatform]
        def archive = new java.util.jar.JarFile(mainJar)
        try {
            if (archive.manifest.mainAttributes.getValue('Implementation-Version')
                    != artifactVersion) {
                throw new GradleException(
                        'publication JAR runtime version does not match publication version')
            }
            if (archive.getEntry('io/superdurable/dex/Client.class') == null) {
                throw new GradleException('publication JAR is missing the Java SDK')
            }
            if (archive.entries().find { entry ->
                entry.name.startsWith('io/superdurable/dex/core/')
                        || entry.name.startsWith('io/superdurable/dex/gen/')
            }) {
                throw new GradleException('publication JAR contains obsolete Java SDK implementations')
            }
            expectedPlatforms.each { platform ->
                def entry = "META-INF/native/${platform}/${nativeLibraries[platform]}"
                if (archive.getEntry(entry) == null) {
                    throw new GradleException("publication JAR is missing ${entry}")
                }
            }
        } finally {
            archive.close()
        }
    }
}
