<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inspect and operate Dex flows" />
    <!-- The query makes browsers that cached the Branch D icon at this path fetch the new mark; bump it when the mark changes. -->
    <link rel="icon" href="/dex-mark.svg?v=pipe-d" type="image/svg+xml" />
    <title>Dex · Super Durable</title>
    <script>
      /* Paint the stored theme before CSS so v2 does not flash the wrong ramps. */
      (function () {
        try {
          var c = localStorage.getItem('dex-web.theme');
          var dark =
            c === 'dark' ||
            (c === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
