name: Check Gate CI

on:
  pull_request:
    # Adding or removing the ci:fast-merge label changes the required workflows.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: check-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-gate:
    name: Check Gate CI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Validate CI runner policy
        run: make ci-runner-check
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            server:
              # Any-pattern matching makes a negation match every other file; use an extglob.
              - 'server/*'
              - 'server/!(all-in-one)/**'
              - 'protos/**'
              - '.github/scripts/dump-docker-logs.sh'
              - '.github/workflows/server-ci.yml'
            server_all_in_one:
              - 'server/**'
              - 'protos/**'
              - '.github/workflows/server-all-in-one-ci.yml'
            sdk_go:
              - 'sdk-go/**'
              - 'protos/**'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/sdk-go-ci.yml'
            sdk_rust:
              - 'sdk-rust/**'
              - '.github/workflows/sdk-rust-ci.yml'
            rust_rules:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/clippy.toml'
              - 'script/check-rust-rules.py'
              - 'script/check_rust_rules_test.py'
              - 'script/rust-crate-layers.json'
              - 'script/rust-rules-baseline.json'
              - 'Makefile'
              - '.github/workflows/rust-rules-ci.yml'
            web:
              - 'web/**'
              - 'protos/**'
              - '.github/workflows/web-ci.yml'
            examples_go:
              - 'examples/go/**'
              - '.github/workflows/examples-go-ci.yml'
            examples_java:
              - 'examples/java/**'
              - '.github/workflows/examples-java-ci.yml'
            examples_python:
              - 'examples/python/**'
              - '.github/workflows/examples-python-ci.yml'
            examples_rust:
              - 'examples/rust/**'
              - '.github/workflows/examples-rust-ci.yml'
            s3mock:
              - 's3mock/**'
              - '.github/workflows/s3mock-ci.yml'
            server_zd:
              - 'server-zd/**'
              - 's3mock/**'
              - 'protos/**'
              - '.github/workflows/server-zd-ci.yml'
            server_zd_image:
              - 'server-zd/Dockerfile'
              - '.dockerignore'
              - '.github/workflows/server-zd-image-release.yml'
              - '.github/workflows/server-zd-image-main.yml'
            examples_typescript:
              - 'examples/typescript/**'
              - '.github/workflows/examples-typescript-ci.yml'
            generated_code:
              - 'protos/**'
              - 'server/gen/dexpb/**'
              - 'sdk-go/gen/dexpb/**'
              - 'sdk-java/src/main/java/io/superdurable/gen/**'
              - 'sdk-python/dex/dexpb/**'
              - 'sdk-python/pyproject.toml'
              - 'sdk-python/uv.lock'
              - 'sdk-typescript/src/gen/**'
              - 'sdk-typescript/scripts/generate-proto.mjs'
              - 'sdk-typescript/package.json'
              - 'sdk-typescript/package-lock.json'
              - 'Makefile'
              - '.github/workflows/generated-code-ci.yml'
            release_tooling:
              - 'script/release/**'
              - '.github/workflows/release-changed-components.yml'
              - '.github/workflows/release-tooling-ci.yml'
              - 'CONTRIBUTING.md'
            skills:
              - 'skills/**'
              - '.github/workflows/skills-ci.yml'
            copyright:
              - 'server/**'
              - 'cli/**'
              - 'sdk-go/**'
              - 'sdk-java/**'
              - 'sdk-python/**'
              - 'sdk-rust/**'
              - 's3mock/**'
              - 'server-zd/**'
              - 'web/**'
              - 'examples/go/**'
              - 'examples/java/**'
              - 'examples/python/**'
              - 'protos/**'
              - 'script/licenseheaders/**'
              - 'LICENSE'
              - 'LEGACY_NOTICES.md'
              - 'LICENSING.md'
              - 'CLA.md'
              - 'CLA-INDIVIDUAL.md'
              - 'CLA-CORPORATE.md'
              - 'Makefile'
              - '.github/workflows/copyright-ci.yml'
      - name: Wait for required workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FILTER_SERVER: ${{ steps.filter.outputs.server }}
          FILTER_SERVER_ALL_IN_ONE: ${{ steps.filter.outputs.server_all_in_one }}
          FILTER_SDK_GO: ${{ steps.filter.outputs.sdk_go }}
          FILTER_SDK_RUST: ${{ steps.filter.outputs.sdk_rust }}
          FILTER_RUST_RULES: ${{ steps.filter.outputs.rust_rules }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_EXAMPLES_GO: ${{ steps.filter.outputs.examples_go }}
          FILTER_EXAMPLES_JAVA: ${{ steps.filter.outputs.examples_java }}
          FILTER_EXAMPLES_PYTHON: ${{ steps.filter.outputs.examples_python }}
          FILTER_EXAMPLES_RUST: ${{ steps.filter.outputs.examples_rust }}
          FILTER_S3MOCK: ${{ steps.filter.outputs.s3mock }}
          FILTER_SERVER_ZD: ${{ steps.filter.outputs.server_zd }}
          FILTER_SERVER_ZD_IMAGE: ${{ steps.filter.outputs.server_zd_image }}
          FILTER_EXAMPLES_TYPESCRIPT: ${{ steps.filter.outputs.examples_typescript }}
          FILTER_GENERATED_CODE: ${{ steps.filter.outputs.generated_code }}
          FILTER_RELEASE_TOOLING: ${{ steps.filter.outputs.release_tooling }}
          FILTER_SKILLS: ${{ steps.filter.outputs.skills }}
          FILTER_COPYRIGHT: ${{ steps.filter.outputs.copyright }}
          IS_FAST_MERGE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:fast-merge') }}
        run: |
          set -euo pipefail

          expected=()
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            expected=(
              "Blob Cache Go CI"
              "Dex CLI CI"
              "Copyright"
              "Go examples CI"
              "Java examples CI"
              "Python examples CI"
              "Rust examples CI"
              "TypeScript examples CI"
              "Generated Code CI"
              "Release Tooling CI"
              "Go SDK CI"
              "Java SDK CI"
              "Python SDK CI"
              "Rust Rules CI"
              "Rust SDK CI"
              "TypeScript SDK CI"
              "S3mock CI"
              "Server CI"
              "Server ZD CI"
              "Server All-in-One CI"
              "Web CI"
            )
          else
            expected+=("CLA")
            [[ "$FILTER_SERVER" == "true" ]] && expected+=("Server CI")
            [[ "$FILTER_SERVER_ALL_IN_ONE" == "true" ]] && expected+=("Server All-in-One CI")
            [[ "$FILTER_SDK_GO" == "true" ]] && expected+=("Go SDK CI")
            [[ "$FILTER_SDK_RUST" == "true" ]] && expected+=("Rust SDK CI")
            [[ "$FILTER_RUST_RULES" == "true" ]] && expected+=("Rust Rules CI")
            [[ "$FILTER_WEB" == "true" ]] && expected+=("Web CI")
            [[ "$FILTER_EXAMPLES_GO" == "true" ]] && expected+=("Go examples CI")
            [[ "$FILTER_EXAMPLES_JAVA" == "true" ]] && expected+=("Java examples CI")
            [[ "$FILTER_EXAMPLES_PYTHON" == "true" ]] && expected+=("Python examples CI")
            [[ "$FILTER_EXAMPLES_RUST" == "true" ]] && expected+=("Rust examples CI")
            [[ "$FILTER_S3MOCK" == "true" ]] && expected+=("S3mock CI")
            [[ "$FILTER_SERVER_ZD" == "true" ]] && expected+=("Server ZD CI")
            [[ "$FILTER_SERVER_ZD_IMAGE" == "true" ]] && expected+=("Server ZD image release")
            [[ "$FILTER_EXAMPLES_TYPESCRIPT" == "true" ]] && expected+=("TypeScript examples CI")
            [[ "$FILTER_GENERATED_CODE" == "true" ]] && expected+=("Generated Code CI")
            [[ "$FILTER_RELEASE_TOOLING" == "true" ]] && expected+=("Release Tooling CI")
            [[ "$FILTER_SKILLS" == "true" ]] && expected+=("Skills CI")
            [[ "$FILTER_COPYRIGHT" == "true" ]] && expected+=("Copyright")
          fi

          # ci:fast-merge stops the existing Temporal/Cadence engine, SDK, CLI, Web, and examples
          # suites from blocking the merge. They still run on the pull request and on main.
          if [[ "$EVENT_NAME" == "pull_request" && "$IS_FAST_MERGE" == "true" ]]; then
            non_blocking=(
              "Blob Cache Go CI"
              "Dex CLI CI"
              "Go SDK CI"
              "Java SDK CI"
              "Python SDK CI"
              "Rust SDK CI"
              "TypeScript SDK CI"
              "Server CI"
              "Server All-in-One CI"
              "Web CI"
              "Go examples CI"
              "Java examples CI"
              "Python examples CI"
              "Rust examples CI"
              "TypeScript examples CI"
            )
            blocking=()
            for name in "${expected[@]}"; do
              is_non_blocking=false
              for skipped in "${non_blocking[@]}"; do
                [[ "$name" == "$skipped" ]] && is_non_blocking=true
              done
              if [[ "$is_non_blocking" == "true" ]]; then
                echo "NOT WAITING $name (ci:fast-merge)"
              else
                blocking+=("$name")
              fi
            done
            expected=("${blocking[@]}")
          fi

          if [[ ${#expected[@]} -eq 0 ]]; then
            echo "No path-matched CI workflows; Check Gate CI succeeded."
            exit 0
          fi

          echo "Waiting for workflows: ${expected[*]}"
          echo "head_sha=$HEAD_SHA"

          deadline=$((SECONDS + 85 * 60))
          while (( SECONDS < deadline )); do
            runs_json="$(gh api \
              "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")"

            failed=0
            pending=0
            for name in "${expected[@]}"; do
              row="$(jq -c --arg name "$name" '
                [.workflow_runs[] | select(.name == $name)]
                | sort_by(.id)
                | reverse
                | if length == 0 then empty
                  else .[0] | {status, conclusion, html_url, id}
                  end
              ' <<<"$runs_json")"

              if [[ -z "$row" ]]; then
                echo "PENDING  $name (not started)"
                pending=1
                continue
              fi

              status="$(jq -r '.status' <<<"$row")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$row")"
              url="$(jq -r '.html_url' <<<"$row")"

              if [[ "$status" != "completed" ]]; then
                echo "PENDING  $name ($status) $url"
                pending=1
                continue
              fi

              if [[ "$conclusion" == "success" ]]; then
                echo "OK       $name $url"
                continue
              fi

              echo "FAILED   $name ($conclusion) $url"
              failed=1
            done

            if (( failed )); then
              echo "One or more required workflows failed."
              exit 1
            fi
            if (( pending == 0 )); then
              echo "All required workflows succeeded."
              exit 0
            fi
            sleep 30
          done

          echo "Timed out waiting for required workflows."
          exit 1
