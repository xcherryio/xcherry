name: Server All-in-One CI

on:
  pull_request:
    paths:
      - "server/**"
      - "protos/**"
      - ".github/workflows/server-all-in-one-ci.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "protos/**"
      - ".github/workflows/server-all-in-one-ci.yml"
  workflow_dispatch:

jobs:
  module:
    name: Vet, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/all-in-one
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/all-in-one/go.mod
          cache-dependency-path: server/all-in-one/go.sum
      - name: Vet, test, and build
        run: GOWORK=off go vet ./... && GOWORK=off go test ./... && GOWORK=off go build ./...

  compose-e2e:
    name: Compose E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/all-in-one/go.mod
          cache-dependency-path: server/all-in-one/go.sum
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        run: docker buildx build --platform linux/amd64 --load --build-arg VERSION=ci-test -t superdurable/dex-server-all-in-one:latest -f server/all-in-one/Dockerfile .
      - name: Check binary version
        run: docker run --rm superdurable/dex-server-all-in-one:latest version | grep -F 'dex-server-all-in-one ci-test ('
      - name: Start two replicas and dependencies
        run: |
          docker compose -f server/all-in-one/compose.yaml up -d
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            first_id="$(docker compose -f server/all-in-one/compose.yaml ps -a -q dex-1)"
            second_id="$(docker compose -f server/all-in-one/compose.yaml ps -a -q dex-2)"
            first_health="$(docker inspect --format '{{.State.Health.Status}}' "$first_id")"
            second_health="$(docker inspect --format '{{.State.Health.Status}}' "$second_id")"
            if [[ "$first_health" == healthy && "$second_health" == healthy ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Both all-in-one replicas did not become healthy" >&2
          exit 1
      - name: Start and observe Flow across replicas
        working-directory: server/all-in-one
        run: GOWORK=off go run ./test/e2e
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f server/all-in-one/compose.yaml logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose -f server/all-in-one/compose.yaml down -v
