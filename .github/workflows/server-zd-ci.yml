name: Server ZD CI

on:
  push:
    branches: [main]
    paths:
      - "server-zd/**"
      - "s3mock/**"
      - "protos/**"
      - ".github/workflows/server-zd-ci.yml"
  pull_request:
    paths:
      - "server-zd/**"
      - "s3mock/**"
      - "protos/**"
      - ".github/workflows/server-zd-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-zd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

# Formatting, Clippy, and tests run as parallel jobs. Each compiling job restores the cache that the
# latest main run saved and never saves its own, so PRs start warm without evicting main's cache.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server-zd
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: make fmt-check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server-zd
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - name: Install libclang for the RocksDB bindings
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Clippy
        run: make clippy

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server-zd
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for the RocksDB bindings
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: make test
