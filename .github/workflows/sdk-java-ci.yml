name: Java SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk-java/**"
      - "sdk-rust/Cargo.lock"
      - "sdk-rust/Cargo.toml"
      - "sdk-rust/crates/dex-blob-cache/**"
      - "sdk-rust/crates/dex-blob-cache-jni/**"
      - "cli/**"
      - "server/**"
      - "protos/**"
      - "codecov.yml"
      - ".github/workflows/sdk-java-ci.yml"
      - ".github/workflows/sdk-java-publish.yml"
  pull_request:
    paths:
      - "sdk-java/**"
      - "sdk-rust/Cargo.lock"
      - "sdk-rust/Cargo.toml"
      - "sdk-rust/crates/dex-blob-cache/**"
      - "sdk-rust/crates/dex-blob-cache-jni/**"
      - "cli/**"
      - "server/**"
      - "protos/**"
      - "codecov.yml"
      - ".github/workflows/sdk-java-ci.yml"
      - ".github/workflows/sdk-java-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: User contracts (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    strategy:
      fail-fast: false
      matrix:
        java-version: ["8", "17", "21", "25", "26"]
    defaults:
      run:
        working-directory: sdk-java
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      # Gradle 9 needs JDK 17+; matrix JDKs are auto-provisioned toolchains.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Compile IWF integration ports
        run: ./gradlew compileTestJava --no-daemon
      - name: Test contracts
        run: ./gradlew test --tests io.superdurable.dex.contracts.UserContractsTest "-PtestJavaVersion=${{ matrix.java-version }}" --no-daemon

  publication:
    name: Maven publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
    defaults:
      run:
        working-directory: sdk-java
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate public API documentation
        run: ./gradlew checkstyleMain javadoc --no-daemon
      - name: Validate Gradle and Maven consumers
        run: ./validate-publication.sh "0.0.2-ci.${GITHUB_RUN_NUMBER}"

  tests:
    name: Integration tests (${{ matrix.worker-mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        worker-mode: [push, pull]
    permissions:
      contents: read
      id-token: write
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
      DEX_INTEG_WORKER_MODE: ${{ matrix.worker-mode }}
    defaults:
      run:
        working-directory: sdk-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            server/go.sum
            web/go.sum
      - name: Install Temporal CLI 1.8.2
        shell: bash
        env:
          TEMPORAL_CLI_SHA256: d8421bda989e6514b4bdb4d63a9012a8a05a806892e881a5aad8510496349a94
        run: |
          archive="${RUNNER_TEMP}/temporal-cli.tar.gz"
          binary_dir="${RUNNER_TEMP}/temporal-cli"
          curl --fail --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 300 \
            --output "${archive}" \
            https://github.com/temporalio/cli/releases/download/v1.8.2/temporal_cli_1.8.2_linux_amd64.tar.gz
          echo "${TEMPORAL_CLI_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "${binary_dir}"
          tar -xzf "${archive}" -C "${binary_dir}"
          echo "${binary_dir}" >> "${GITHUB_PATH}"
          "${binary_dir}/temporal" --version
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run JVM and dexcli dev integration coverage
        env:
          # Integration coverage runs on the oldest supported test JVM.
          ORG_GRADLE_PROJECT_testJavaVersion: "8"
        run: ./run-integration-tests.sh --coverage
      - name: Upload Java integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./sdk-java/build/reports/jacoco/integration/jacoco.xml
          flags: sdk-java-integration
          name: sdk-java-integration-${{ matrix.worker-mode }}
          use_oidc: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-java-integration-coverage-${{ matrix.worker-mode }}
          path: sdk-java/build/reports/jacoco/integration/
          if-no-files-found: ignore
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-java-integration-services-${{ matrix.worker-mode }}
          path: /tmp/test-java-sdk-integration-services.log
          if-no-files-found: ignore
