name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "!server/all-in-one/**"
      - "protos/**"
      - "codecov.yml"
      - ".github/scripts/dump-docker-logs.sh"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "!server/all-in-one/**"
      - "protos/**"
      - "codecov.yml"
      - ".github/scripts/dump-docker-logs.sh"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Unit tests
        env:
          GOWORK: "off"
        run: make unitTests

  blob-store-integ:
    name: Blob Store integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start MinIO
        run: docker compose -f docker-compose/ci-temporal-dependencies.yml up -d --wait minio
      - name: Blob Store integration tests
        env:
          GOWORK: "off"
        run: make blobStoreIntegTests integrationCoverageDir=coverage-raw
      - name: Upload integration coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-integration-coverage-blob-store
          path: server/coverage-raw/
          if-no-files-found: ignore
          retention-days: 1
      - name: Dump docker logs
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-docker-logs.sh"

  web-api-integ:
    name: Web API integration (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: temporal
            compose_file: docker-compose/ci-temporal-dependencies.yml
            make_target: ci-web-api-temporal-test
          - backend: cadence
            compose_file: docker-compose/ci-cadence-dependencies.yml
            make_target: ci-web-api-cadence-test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start ${{ matrix.backend }} dependencies
        run: docker compose -f ${{ matrix.compose_file }} up -d
      - name: Web API integration tests
        env:
          GOWORK: "off"
        run: make ${{ matrix.make_target }} integrationCoverageDir=coverage-raw
      - name: Upload integration coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-integration-coverage-web-api-${{ matrix.backend }}
          path: server/coverage-raw/
          if-no-files-found: ignore
          retention-days: 1
      - name: Dump docker logs
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-docker-logs.sh"

  temporal-integ:
    name: Temporal integration (partition ${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start Temporal dependencies
        run: docker compose -f docker-compose/ci-temporal-dependencies.yml up -d
      - name: Temporal integ tests
        env:
          GOWORK: "off"
        run: make ci-temporal-integ-test totalPartitions=5 partitionNum=${{ matrix.partition }} integrationCoverageDir=coverage-raw
      - name: Upload integration coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-integration-coverage-temporal-${{ matrix.partition }}
          path: server/coverage-raw/
          if-no-files-found: ignore
          retention-days: 1
      - name: Dump docker logs
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-docker-logs.sh"

  cadence-integ:
    name: Cadence integration (partition ${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start Cadence dependencies
        run: docker compose -f docker-compose/ci-cadence-dependencies.yml up -d
      - name: Cadence integ tests
        env:
          GOWORK: "off"
        run: make ci-cadence-integ-test totalPartitions=2 partitionNum=${{ matrix.partition }} integrationCoverageDir=coverage-raw
      - name: Upload integration coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-integration-coverage-cadence-${{ matrix.partition }}
          path: server/coverage-raw/
          if-no-files-found: ignore
          retention-days: 1
      - name: Dump docker logs
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-docker-logs.sh"

  integration-coverage:
    name: Integration coverage
    needs:
      - blob-store-integ
      - web-api-integ
      - temporal-integ
      - cadence-integ
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Download integration coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: server-integration-coverage-*
          path: server/coverage-raw
      - name: Merge integration coverage
        run: ./script/merge-integ-coverage.sh coverage coverage-raw/*
      - name: Upload server integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./server/coverage/coverage.out
          flags: server-integration
          name: server-integration
          use_oidc: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-integration-coverage
          path: server/coverage/
          if-no-files-found: ignore
