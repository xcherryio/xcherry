name: S3mock AWS conformance

# Runs the s3mock conformance suite against real S3 so s3mock behavior stays comparable with AWS.
# Configure the repository variable S3MOCK_CONFORMANCE_AWS_ROLE_ARN (an IAM role trusted for
# GitHub OIDC with full S3 access to buckets named s3mock-conformance-*) to enable it.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: s3mock-aws-conformance
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  aws:
    name: Conformance suite against AWS S3
    if: vars.S3MOCK_CONFORMANCE_AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: s3mock
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.S3MOCK_CONFORMANCE_AWS_ROLE_ARN }}
          aws-region: us-east-1
      # A cancelled run cannot clean up after itself; no run lasts a day, so older buckets are leftovers.
      - name: Delete conformance buckets left by earlier cancelled runs
        env:
          AWS_REGION: us-east-1
        run: |
          set -uo pipefail
          cutoff="$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%S)"
          aws s3api list-buckets --output json \
            | jq -r --arg cutoff "$cutoff" '.Buckets[] | select((.Name | startswith("s3mock-conformance-")) and .CreationDate < $cutoff) | .Name' \
            > "$RUNNER_TEMP/s3mock-stale-buckets.txt"
          echo "stale buckets: $(wc -l < "$RUNNER_TEMP/s3mock-stale-buckets.txt")"
          cat "$RUNNER_TEMP/s3mock-stale-buckets.txt" >> "$RUNNER_TEMP/s3mock-conformance-buckets.txt"
      - name: Run the conformance suite against AWS S3
        env:
          S3MOCK_CONFORMANCE_TARGET: aws
          S3MOCK_CONFORMANCE_BUCKET_LOG: ${{ runner.temp }}/s3mock-conformance-buckets.txt
          AWS_REGION: us-east-1
        run: cargo test --locked -p s3mock-conformance -- --test-threads=4
      # Tests delete their buckets only when they pass, so remove whatever this run created.
      - name: Delete buckets this run created
        if: always()
        env:
          BUCKET_LOG: ${{ runner.temp }}/s3mock-conformance-buckets.txt
          AWS_REGION: us-east-1
        run: |
          set -uo pipefail
          [[ -f "$BUCKET_LOG" ]] || exit 0
          sort -u "$BUCKET_LOG" | while read -r bucket; do
            aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1 || continue
            aws s3api list-multipart-uploads --bucket "$bucket" --output json \
              | jq -r '.Uploads[]? | [.Key, .UploadId] | @tsv' \
              | while IFS=$'\t' read -r key upload_id; do
                  aws s3api abort-multipart-upload --bucket "$bucket" --key "$key" --upload-id "$upload_id"
                done
            while true; do
              batch="$(aws s3api list-object-versions --bucket "$bucket" --max-items 1000 --output json \
                | jq -c '{Objects: ([.Versions[]?, .DeleteMarkers[]?] | map({Key, VersionId})), Quiet: true}')"
              [[ "$(jq '.Objects | length' <<<"$batch")" == "0" ]] && break
              aws s3api delete-objects --bucket "$bucket" --delete "$batch" >/dev/null
            done
            aws s3api delete-bucket --bucket "$bucket"
          done
