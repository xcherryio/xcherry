name: Copyright

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "cli/**"
      - "sdk-go/**"
      - "blob-cache-go/**"
      - "sdk-java/**"
      - "sdk-python/**"
      - "sdk-rust/**"
      - "s3mock/**"
      - "web/**"
      - "examples/go/**"
      - "examples/java/**"
      - "examples/python/**"
      - "protos/**"
      - "script/licenseheaders/**"
      - "script/release/**"
      - "LICENSE"
      - "LEGACY_NOTICES.md"
      - "LICENSING.md"
      - "CLA.md"
      - "CLA-INDIVIDUAL.md"
      - "CLA-CORPORATE.md"
      - "Makefile"
      - ".github/workflows/copyright-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "cli/**"
      - "sdk-go/**"
      - "blob-cache-go/**"
      - "sdk-java/**"
      - "sdk-python/**"
      - "sdk-rust/**"
      - "s3mock/**"
      - "web/**"
      - "examples/go/**"
      - "examples/java/**"
      - "examples/python/**"
      - "protos/**"
      - "script/licenseheaders/**"
      - "script/release/**"
      - "LICENSE"
      - "LEGACY_NOTICES.md"
      - "LICENSING.md"
      - "CLA.md"
      - "CLA-INDIVIDUAL.md"
      - "CLA-CORPORATE.md"
      - "Makefile"
      - ".github/workflows/copyright-ci.yml"
  workflow_dispatch:

jobs:
  copyright-check:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Verify license headers
        run: make copyright-check
