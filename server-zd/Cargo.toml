[workspace]
members = [
    "crates/dexzd-api",
    "crates/dexzd-apply",
    "crates/dexzd-clock",
    "crates/dexzd-cluster-metadata",
    "crates/dexzd-e2e-tests",
    "crates/dexzd-engine",
    "crates/dexzd-keyspace",
    "crates/dexzd-log",
    "crates/dexzd-metrics",
    "crates/dexzd-object-store",
    "crates/dexzd-protocol",
    "crates/dexzd-request-validation",
    "crates/dexzd-search",
    "crates/dexzd-server",
    "crates/dexzd-simulation",
    "crates/dexzd-storage",
    "crates/dexzd-stream-store",
    "crates/dexzd-visibility-query",
    "crates/dexzd-worker-dispatch",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
repository = "https://github.com/superdurable/dex"
rust-version = "1.97"
publish = false

[workspace.dependencies]
async-trait = "0.1"
aws-config = { version = "1.13", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.155", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dexzd-api = { path = "crates/dexzd-api" }
dexzd-apply = { path = "crates/dexzd-apply" }
dexzd-clock = { path = "crates/dexzd-clock" }
dexzd-cluster-metadata = { path = "crates/dexzd-cluster-metadata" }
dexzd-engine = { path = "crates/dexzd-engine" }
dexzd-keyspace = { path = "crates/dexzd-keyspace" }
dexzd-log = { path = "crates/dexzd-log" }
dexzd-metrics = { path = "crates/dexzd-metrics" }
dexzd-object-store = { path = "crates/dexzd-object-store" }
dexzd-protocol = { path = "crates/dexzd-protocol" }
dexzd-request-validation = { path = "crates/dexzd-request-validation" }
dexzd-search = { path = "crates/dexzd-search" }
dexzd-server = { path = "crates/dexzd-server" }
dexzd-storage = { path = "crates/dexzd-storage" }
dexzd-stream-store = { path = "crates/dexzd-stream-store" }
dexzd-visibility-query = { path = "crates/dexzd-visibility-query" }
dexzd-worker-dispatch = { path = "crates/dexzd-worker-dispatch" }
dhat = "0.3"
futures = "0.3"
humantime-serde = "1"
prost = "0.14"
prost-types = "0.14"
prometheus-client = "0.25.1"
protoc-bin-vendored = "3.2"
rand = "0.10"
rand_chacha = "0.10"
rocksdb = { version = "0.25", default-features = false, features = ["lz4", "zstd", "bindgen-runtime"] }
rustix = { version = "1.1", features = ["param"] }
s3mock = { path = "../s3mock/crates/s3mock" }
s3mock-server = { path = "../s3mock/crates/s3mock-server" }
self_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
siphasher = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower-layer = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "v7"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[profile.dev]
# Line tables keep backtraces useful; full debug info multiplies target sizes across worktrees.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.block-buffer]
opt-level = 3
debug = false

[profile.dev.package.crypto-common]
opt-level = 3
debug = false

[profile.dev.package.digest]
opt-level = 3
debug = false

[profile.dev.package.hmac]
opt-level = 3
debug = false

[profile.dev.package.s3mock-server]
opt-level = 3
debug = false

[profile.dev.package.sha2]
opt-level = 3
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
let_underscore_must_use = "warn"
let_underscore_future = "warn"
unused_result_ok = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
print_stdout = "warn"
print_stderr = "warn"
match_wildcard_for_single_variants = "warn"
