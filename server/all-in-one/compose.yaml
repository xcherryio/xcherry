x-dex-environment: &dex-environment
  DB: postgres12_pgx
  POSTGRES_SEEDS: postgres
  POSTGRES_USER: temporal
  POSTGRES_PWD: temporal
  DBNAME: temporal
  VISIBILITY_DBNAME: temporal_visibility
  BIND_ON_IP: 0.0.0.0
  TEMPORAL_CLUSTER_FRONTEND_ADDRESS: temporal-frontend:7233
  DEX_NAMESPACE: default
  DEX_HISTORY_RETENTION_DAYS: "3"
  DEX_S3_ENDPOINT: http://minio:9000
  DEX_S3_BUCKET: dex-blobs
  DEX_S3_REGION: us-east-1
  DEX_S3_ACCESS_KEY: minioadmin
  DEX_S3_SECRET_KEY: minioadmin

x-dex-service: &dex-service
  image: superdurable/dex-server-all-in-one:latest
  restart: unless-stopped
  environment: *dex-environment
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_started
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    backend:
      aliases:
        - temporal-frontend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]

  minio:
    image: pgsty/silo:${SILO_VERSION:-RELEASE.2026-09-03T13-18-01Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
    volumes:
      - minio-data:/data
    networks: [backend]

  dex-1:
    <<: *dex-service
    ports:
      - "8801:8801"

  dex-2:
    <<: *dex-service
    ports:
      - "8802:8801"

volumes:
  postgres-data:
  minio-data:

networks:
  backend:
