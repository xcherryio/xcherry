# please see all available config in https://github.com/superdurable/dex/blob/main/config/config.go
# You can use volume mount to override this config path(/dex/config/config_template.yaml), e.g. for production
api:
  port: 8801
  # Opt in only when Update validation and atomic commits justify Temporal's Update concurrency usage.
  useTemporalSynchronousUpdateForAllRPCs: false
  queryWorkflowFailedRetryPolicy:
    initialInterval: 100ms
    backoffCoefficient: 1
    maximumInterval: 100ms
    maximumAttempts: 5
  invokeRPCContinuedAsNewErrorRetryPolicy:
    initialInterval: 100ms
    backoffCoefficient: 2
    maximumInterval: 1s
    totalDuration: 5s
web:
  bindAddress: 0.0.0.0
  port: 8802
  flowServiceTarget: localhost:8801
  flowRenderingDirectory: ""
  # Apply headless routing to every Worker target submitted through Dex Web Start Flow.
  startFlowWorkerTargetHeadless: false
worker:
  # Refresh individual endpoints behind headless WorkerService DNS.
  headlessAddressRefreshInterval: 60s
  # Bound remembered flow-to-endpoint routes.
  maxStickyRoutingEntries: 100000
  # Includes the first headless transport attempt within one activity attempt.
  workerServiceRequestMaxAttempts: 3
  # gRPC status codes that trigger failover between resolved headless endpoints.
  headlessFailoverStatusCodes: [14, 4, 2]
interpreter:
  # Bounds backend index creation and propagation checks. Existing indexes return immediately.
  attributeIndexSyncTimeout: 2m
  # Trusts externally provisioned indexes and skips backend discovery and creation.
  attributeIndexesManagedExternally: false
  interpreterActivityConfig:
    # Minimum explicit Step heartbeat timeout. Zero uses 10s.
    minimumStepHeartbeatTimeout: 10s
    # Retains SubFlow-start retries inside the engine's local activity.
    subFlowStartActivityConfig:
      # Bounds the whole local retry window.
      scheduleToCloseTimeout: 2m
      retryPolicy:
        initialInterval: 100ms
        backoffCoefficient: 2
        maximumInterval: 60s
        # Zero leaves attempts unbounded within the retry window.
        maximumAttempts: 0
        # Zero uses the retry window above.
        totalDuration: 0s
  temporal:
    hostPort: "temporal:7233"
    namespace: "default"
    cloudAPIKey: ""
    # Configure for Temporal Cloud. Omit for self-hosted Temporal.
    # cloudOps:
    #   hostPort: "saas-api.tmprl.cloud:443"
    #   apiVersion: "v0.19.1"
blobStore:
  enabled: true
  asyncStepInputSnapshotsEnabled: true
  thresholdInBytes: 100
  objectIdLength: 10
  historyRetentionInDays: 3
  supportedStorages:
    - status: active
      storageId: "local"
      storageType: "local"
      localDirectory: "/dex/dex-blobs"
