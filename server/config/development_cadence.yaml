api:
  port: 8801
  # Ignored by Cadence; shown for parity with the Temporal template.
  useTemporalSynchronousUpdateForAllRPCs: false
  queryWorkflowFailedRetryPolicy:
    initialInterval: 100ms
    backoffCoefficient: 1
    maximumInterval: 100ms
    maximumAttempts: 5
  invokeRPCContinuedAsNewErrorRetryPolicy:
    initialInterval: 100ms
    backoffCoefficient: 2
    maximumInterval: 1s
    totalDuration: 5s
web:
  bindAddress: 0.0.0.0
  port: 8802
  flowServiceTarget: localhost:8801
  # flowServiceCredentialFile: /etc/dex/web-token
interpreter:
  attributeIndexSyncTimeout: 2m
  interpreterActivityConfig:
    minimumStepHeartbeatTimeout: 10s
  #  disableSystemSearchAttributes: true # (deprecated) set to true if you don't have advanced visibility in Cadence, see more https://github.com/uber/cadence/issues/5085
  #  executingStateIdMode: DISABLED # set to true if you don't have advanced visibility in Cadence, see more https://github.com/uber/cadence/issues/5085
  cadence:
    hostPort: 127.0.0.1:7833
    domain: default
    adminSecurityToken: ""
blobStore:
  enabled: true
  asyncStepInputSnapshotsEnabled: true
  thresholdInBytes: 100
  objectIdLength: 10
  historyRetentionInDays: 3
  supportedStorages:
    - status: active
      storageId: "local-cadence"
      storageType: "local"
      localDirectory: "./dex-blobs-cadence"
streamStore:
  backend: memory
