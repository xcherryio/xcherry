log:
  stdout: true
  level: info
  levelKey: "level"
api:
  port: 8801
  # Opt in only when Update validation and atomic commits justify Temporal's Update concurrency usage.
  useTemporalSynchronousUpdateForAllRPCs: false
  queryWorkflowFailedRetryPolicy:
    initialInterval: 100ms
    backoffCoefficient: 1
    maximumInterval: 100ms
    maximumAttempts: 5
  invokeRPCContinuedAsNewErrorRetryPolicy:
    initialInterval: 100ms
    backoffCoefficient: 2
    maximumInterval: 1s
    totalDuration: 5s
web:
  bindAddress: 0.0.0.0
  port: 8802
  flowServiceTarget: localhost:8801
  # flowServiceCredentialFile: /etc/dex/web-token
interpreter:
  attributeIndexSyncTimeout: 2m
  interpreterActivityConfig:
    minimumStepHeartbeatTimeout: 10s
  temporal:
    hostPort: localhost:7233
    namespace: default
    prometheus:
      listenAddress: 0.0.0.0:8890
      timerType: histogram
blobStore:
  enabled: true
  asyncStepInputSnapshotsEnabled: true
  thresholdInBytes: 100
  objectIdLength: 10
  historyRetentionInDays: 3
  # S3 Attribute cache. The directory must be exclusive to this Server process.
  # TinyLFU may bypass writes when existing entries are hotter.
  # blobCache:
  #   directory: /var/lib/dex/attribute-cache
  #   maxBytes: 1073741824
  supportedStorages:
    - status: active
      storageId: "local-dev-s3"
      storageType: "s3"
      s3Endpoint: "http://localhost:9000"
      s3Bucket: "dex-test-bucket"
      s3Region: "us-east-1"
      s3AccessKey: "minioadmin"
      s3SecretKey: "minioadmin"
      cleanupStrategy:
        cleanupStrategyType: afterAllRunsDeleted
        cleanupFrequencyInDays: 1
    # Local filesystem alternative:
    # - status: active
    #   storageId: "local-dev"
    #   storageType: "local"
    #   localDirectory: "./dex-blobs"

