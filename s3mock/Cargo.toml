[workspace]
members = [
    "crates/s3mock",
    "crates/s3mock-server",
    "crates/s3mock-conformance",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
repository = "https://github.com/superdurable/dex"
rust-version = "1.97"
publish = false

[workspace.dependencies]
aws-config = { version = "1.13", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.155", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32c = "0.6"
crc32fast = "1"
crc64fast-nvme = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
http = "1"
http-body = "1"
hmac = "0.12"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1"] }
md-5 = "0.10"
percent-encoding = "2"
quick-xml = "0.37"
redb = "4"
s3mock = { path = "crates/s3mock" }
s3mock-server = { path = "crates/s3mock-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "fs", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
let_underscore_must_use = "warn"
let_underscore_future = "warn"
unused_result_ok = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
print_stdout = "warn"
print_stderr = "warn"
match_wildcard_for_single_variants = "warn"
